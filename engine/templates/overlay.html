<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>overlay</title>
    <link rel="stylesheet" href="/engine/base.css" />
  </head>
  <body>
    <div class="stage"><canvas id="scene" width="1080" height="1920"></canvas></div>
    <script type="module">
      // Generated by scripts/overlay.py from engine/templates/overlay.html. CONFIG is injected below.
      import * as B from "/engine/brand-layer.js";
      import { drawFootage, preloadFootage, prefetchFrames, setCacheSize, frameIndex } from "/engine/footage.js";
      import { planLayout, drawQa } from "/engine/layout.js";
      import * as Edl from "/engine/edl.js";
      import * as Tr from "/engine/transitions/index.js";

      const CONFIG = /*CONFIG*/ {};
      // CONFIG: { clips:[{name, start, dur, n, faces:{source, samples}}], aiLabel:true|false|null, hook:{text,inAt,outAt}|null, words:bool, cta:{at,dur,title,subtitle}|null, captions:{y,size}, logoUntil:number|null, duration, motion:[...] (see engine/README.md) }
      const brand = await B.loadBrand("../brand.json");
      const ctx = document.getElementById("scene").getContext("2d");
      B.setCanvas(ctx);
      let words = CONFIG.words ? await (await fetch("./words.json")).json() : [];
      let DURATION = CONFIG.duration;
      // Optional comp files edited by the studio (overlay.py sets the flags when the files exist): zones.json = platform zones
      // {top,bottom,left,right}; captions.json = {style:{y,size,cx,maxW,...}, segments:[{in,out,text,words?,hidden?}]|null}.
      const fetchJson = async (u) => {
        try {
          const r = await fetch(u, { cache: "no-store" });
          return r.ok ? await r.json() : null;
        } catch {
          return null;
        }
      };
      let ZONES_DOC = CONFIG.zonesFile ? await fetchJson("./zones.json") : null;
      let CAP_DOC = CONFIG.captionsFile ? await fetchJson("./captions.json") : null;
      // products.json (RUN level, written by the studio / a catalog adapter): the only source of product images for productCard / productPop /
      // carousel. Absent = no products (comps without product elements behave exactly as before).
      B.setProducts(CONFIG.productsFile ? await fetchJson("../products.json") : null);
      // ui-skin.json (comp level, copied by overlay.py when the run / brand has one): look of the product-screen elements (uiList, uiForm...). Absent = derived from brand.json.
      B.setUiSkin(CONFIG.uiSkinFile ? await fetchJson("./ui-skin.json") : null);
      // Comp-local element types (<comp>/motion-lib/<type>.js; overlay.py sets the flag when the folder exists): registered for this video only.
      if (CONFIG.localLib) await B.loadLocalLib("./motion-lib/");
      window.loadLocalLib = (url) => B.loadLocalLib(url); // the Estudio registers comp-local elements added after the last build
      B.setZones(ZONES_DOC ?? {}); // {} = the default zones: identical to the built-in constants
      const capStyle = () => ({ ...(CONFIG.captions ?? {}), ...(CAP_DOC?.style ?? {}) });
      const capPhrases = () => (CAP_DOC?.segments ? B.segmentsToPhrases(CAP_DOC.segments) : undefined);

      // logo.json (CONFIG.logoFile, written by the studio): where / how the logo bug appears (see engine/studio/README.md). Absent = today's look.
      // cta.json is baked into CONFIG.cta by overlay.py (title, subtitle, duration); CTA_DOC only carries live studio edits of title / subtitle / bg /
      // logoVariant, with CONFIG.ctaArgv (the command-line values) as the fallback for keys the doc does not set.
      let LOGO_DOC = CONFIG.logoFile ? await fetchJson("./logo.json") : null;
      let CTA_DOC = null;
      await B.setLogoSrc(LOGO_DOC?.src); // per-comp logo image: decoded before READY; a failure lands in window.ASSET_ERRORS (render.mjs aborts)
      const LOGO_KEYS = ["hidden", "corner", "x", "y", "w", "h", "opacity", "enter", "fadeDur", "scrim", "shadow", "autoHide", "in", "out", "variant"];
      const logoOpts = () => {
        const o = {};
        for (const k of LOGO_KEYS) if (LOGO_DOC && LOGO_DOC[k] !== undefined && LOGO_DOC[k] !== null) o[k] = LOGO_DOC[k];
        if (LOGO_DOC?.src && B.hasCustomLogo()) o.variant = "custom";
        return o;
      };
      const ctaOpts = () => {
        const c = CONFIG.cta ?? {};
        if (!CTA_DOC) return { title: c.title, subtitle: c.subtitle, bg: c.bg, logoVariant: c.logoVariant };
        const base = CONFIG.ctaArgv ?? c;
        return { title: CTA_DOC.title ?? base.title, subtitle: CTA_DOC.subtitle ?? base.subtitle, bg: CTA_DOC.bg, logoVariant: CTA_DOC.logoVariant };
      };

      // EDL (engine/edl.js): which parts of the clips (the "bin" = CONFIG.clips) make the video. CONFIG.edl = the cut baked by overlay.py
      // from <comp>/edl.json, or null (clips back to back, exactly as before). window.setEdl(edl) swaps it live (studio): the duration,
      // CTA time, hook end, words (captions) and face lookups follow. With no EDL nothing below changes a single drawn pixel.
      const BIN = CONFIG.clips.map((c) => ({ name: c.name, dur: c.dur }));
      const CLIP = Object.fromEntries(CONFIG.clips.map((c) => [c.name, c]));
      const WORDS_BY_CLIP = {};
      if (CONFIG.words) for (const c of CONFIG.clips) WORDS_BY_CLIP[c.name] = (await fetchJson(`../footage/${c.name}/words.json`)) ?? [];
      // Comps built before per-clip words existed: derive them from the concatenated words.json so a cut can still be made in the studio.
      if (CONFIG.words && !CONFIG.edl && CONFIG.clips.every((c) => !WORDS_BY_CLIP[c.name].length)) {
        for (const c of CONFIG.clips) WORDS_BY_CLIP[c.name] = words.filter((w) => w.start >= c.start - 0.02 && w.end <= c.start + c.dur + 0.02).map((w) => ({ ...w, start: w.start - c.start, end: w.end - c.start }));
      }
      const BAKED = { duration: DURATION, ctaAt: CONFIG.cta?.at, hookOut: CONFIG.hook?.outAt, words };
      const legacyWords = () => (CONFIG.edl ? CONFIG.clips.flatMap((c) => (WORDS_BY_CLIP[c.name] ?? []).map((w) => ({ ...w, start: w.start + c.start, end: w.end + c.start }))) : BAKED.words);
      let EDL = null, PLAN_CLIPS = CONFIG.clips;
      // Face tracks follow the cut: one virtual clip per segment on the output timeline (sample frames re-based to the segment start).
      const virtualClips = () => {
        const segs = Edl.layout(EDL).segs;
        return segs.map((s, i) => {
          const c = CLIP[s.clip];
          const base = Math.round(s.in * 30);
          const lo = -30, hi = Math.round(s.len * 30) + 30;
          // a retimed segment (speed) runs its source frames at `speed` x: sample frames are re-based to OUTPUT frames
          const samples = (c.faces?.samples ?? []).map((x) => ({ ...x, f: s.speed ? (x.f - base) / s.speed : x.f - base })).filter((x) => x.f >= lo && x.f <= hi);
          return { name: s.clip, start: s.start, dur: s.len - (segs[i + 1]?.d ?? 0), n: c.n, faces: { ...c.faces, samples } };
        });
      };
      // SFX events of the registry transitions follow the cut (Edl.transitionEvents); the motion events are kept as they are.
      const syncTransitionEvents = () => {
        if (!window.TIMELINE) return;
        const motion = window.TIMELINE.events.filter((e) => !String(e.key ?? "").startsWith("tr:"));
        window.TIMELINE.events = [...motion, ...Edl.transitionEvents(EDL)].sort((a, b) => a.t - b.t);
      };
      const setEdlDoc = (edl) => {
        EDL = edl?.segments?.length ? Edl.normalize(edl, BIN, WORDS_BY_CLIP).edl : null; // WORDS_BY_CLIP: a segment with `speed` over spoken words loses it
        if (!EDL) {
          DURATION = BAKED.duration; words = legacyWords(); PLAN_CLIPS = CONFIG.clips;
          if (CONFIG.cta) CONFIG.cta.at = BAKED.ctaAt;
          if (CONFIG.hook) CONFIG.hook.outAt = BAKED.hookOut;
        } else {
          const end = Edl.duration(EDL);
          DURATION = end + (CONFIG.cta ? CONFIG.cta.dur : 0);
          if (CONFIG.cta) CONFIG.cta.at = end;
          if (CONFIG.hook) CONFIG.hook.outAt = Math.min(BAKED.hookOut ?? end, end);
          words = Edl.remapWords(EDL, WORDS_BY_CLIP);
          PLAN_CLIPS = virtualClips();
        }
        if (window.STUDIO) Object.assign(window.STUDIO, { duration: DURATION, words, edl: EDL });
        if (window.TIMELINE) window.TIMELINE.DURATION = DURATION;
        syncTransitionEvents();
      };
      setEdlDoc(CONFIG.edl ?? null);

      // Face-aware placement: elements without explicit x/y get a slot that keeps clear of the face (engine/layout.js).
      // applyMotion() (re)runs the planner, so the studio can swap the elements at runtime via window.setMotion(elements).
      // Called once with CONFIG.motion, the rendered output is identical to a comp without the hook.
      // Backdrop sampler for motion-lib elements that adapt to what is behind them (uiIcons plate "auto"): the footage alone, no overlays, at time t.
      // Only called when such an element exists; it is a pure read of the footage, so comps without them render exactly as before.
      const scratch = document.createElement("canvas");
      scratch.width = B.W;
      scratch.height = B.H;
      const scratchCtx = scratch.getContext("2d", { willReadFrequently: true });
      B.setBackdropSampler(async (t) => {
        scratchCtx.fillStyle = "#000";
        scratchCtx.fillRect(0, 0, B.W, B.H);
        if (EDL) await drawCut(scratchCtx, t);
        else {
          const clip = CONFIG.clips.find((c) => t >= c.start && t < c.start + c.dur) ?? CONFIG.clips[CONFIG.clips.length - 1];
          if (clip) await drawFootage(scratchCtx, `../footage/${clip.name}`, t, { start: clip.start, fps: 30, fit: "cover", n: clip.n });
        }
        return scratchCtx;
      });
      const BAKED_PANELS = (CONFIG.motion ?? []).filter((e) => e.type === "panel");
      let PLAN, MOTION, HIGHLIGHT, LAST_ELEMENTS = CONFIG.motion;
      const applyMotion = (elements) => {
        LAST_ELEMENTS = elements;
        // Panel clips are extracted by overlay.py, which adds dir/n to the in-memory element only: re-attach them by clip path.
        const els = (elements ?? []).map((e) => {
          if (e.type !== "panel" || e.dir) return e;
          const baked = BAKED_PANELS.find((p) => p.clip === e.clip && p.dir);
          return baked ? { ...e, dir: baked.dir, n: baked.n } : e;
        });
        PLAN = planLayout({
          elements: els, clips: PLAN_CLIPS, hasCaptions: words.length > 0 || !!CAP_DOC?.segments?.length, captions: capStyle(),
          hook: CONFIG.hook, cta: CONFIG.cta, logoUntil: CONFIG.logoUntil, logo: logoOpts()
        });
        MOTION = PLAN.elements;
        B.loadUiAssets(MOTION); // skin font + thumbs / avatars of ui elements; draw() awaits B.uiReady(); no ui elements = nothing happens
        B.loadProductImages(MOTION); // decode product photos; draw() awaits B.productsReady(); failures -> ASSET_ERRORS
        HIGHLIGHT = B.highlightOptions(MOTION); // {"type":"highlightWords"} elements -> caption word highlight
        window.LAYOUT = { report: PLAN.report }; // render.mjs writes it to layout-report.json
        // SFX-sync events come from the config (deterministic), never from render calls.
        window.TIMELINE = { DURATION, events: [...B.motionEvents(MOTION)] };
        syncTransitionEvents();
        return PLAN;
      };
      applyMotion(CONFIG.motion);
      window.setMotion = applyMotion;
      window.setUiSkin = (doc) => { B.setUiSkin(doc); return applyMotion(LAST_ELEMENTS); }; // studio: ui-skin.json changed
      window.setProducts = (doc) => { B.setProducts(doc); return applyMotion(LAST_ELEMENTS); }; // studio: products.json changed
      // Studio hooks (unused by offline renders): re-plan after the platform zones / caption document change.
      window.setZones = (z) => { ZONES_DOC = z; B.setZones(z ?? {}); return applyMotion(LAST_ELEMENTS); };
      window.setCaptions = (d) => { CAP_DOC = d; return applyMotion(LAST_ELEMENTS); };
      window.setEdl = (edl) => { setEdlDoc(edl); return applyMotion(LAST_ELEMENTS); };
      window.setLogoSrc = (src) => B.setLogoSrc(src); // studio: await this before setState({logo}) when logo.json `src` changes
      window.setState = ({ elements, zones, captions, edl, logo, cta }) => { if (logo !== undefined) LOGO_DOC = logo; if (cta !== undefined) { CTA_DOC = cta; B.clearAssetIssues("cta-logo"); } if (edl !== undefined) setEdlDoc(edl); ZONES_DOC = zones ?? null; B.setZones(ZONES_DOC ?? {}); CAP_DOC = captions ?? null; return applyMotion(elements); };
      window.getAutoPhrases = () => B.groupPhrases(words, { maxWords: capStyle().maxWords, maxChars: capStyle().maxChars }).map((p) => ({ start: p.start, end: p.end, words: p.words }));
      window.getCaptionRect = B.getCaptionRect;
      window.getZones = B.getZones;
      // Footage look-ahead for smooth playback in the studio.
      window.prefetch = (t, count = 14) => {
        if (EDL) { // current segment + whatever starts inside the look-ahead window (incl. the outgoing side of a blend)
          for (const tt of [t, t + count / 30]) {
            const r = Edl.outToSrc(EDL, tt);
            for (const l of r?.layers ?? []) prefetchFrames(`../footage/${l.clip}`, frameIndex(l.srcT, { start: 0, fps: 30, n: CLIP[l.clip].n }), count, CLIP[l.clip].n);
          }
          return;
        }
        const clip = CONFIG.clips.find((c) => t >= c.start && t < c.start + c.dur) ?? CONFIG.clips[CONFIG.clips.length - 1];
        prefetchFrames(`../footage/${clip.name}`, frameIndex(t, { start: clip.start, fps: 30, n: clip.n }), count, clip.n);
      };
      window.setFootageCache = setCacheSize;
      // Studio live preview draws into an off-screen canvas and blits the finished frame (window.__BUFFER = true), so the visible
      // canvas is never left cleared while a footage frame decodes. Off (default), render(t) draws straight to the page canvas.
      const off = document.createElement("canvas");
      off.width = B.W;
      off.height = B.H;
      const offCtx = off.getContext("2d");
      window.__BUFFER = false;
      window.getPlan = () => PLAN; // studio: PLAN.rects[i] / PLAN.report.elements[i] share the index of the elements passed to setMotion
      window.STUDIO = { words, duration: DURATION, cta: CONFIG.cta, hook: CONFIG.hook, captions: CONFIG.captions ?? {}, clips: CONFIG.clips.map((c) => ({ name: c.name, start: c.start, dur: c.dur, n: c.n })), edl: EDL, bin: CONFIG.clips.map((c) => ({ name: c.name, dur: c.dur, n: c.n })), hasWords: !!CONFIG.words };
      window.STUDIO.logoUntil = CONFIG.logoUntil ?? null; // studio timeline: where the logo bug ends by default

      // Studio: clips uploaded after this comp was built (RUN/footage/<name>/ already extracted by scripts/media_prepare.py). list = [{name, start:0,
      // dur, n, faces?}]. They join the bin (BIN / CLIP / WORDS_BY_CLIP / STUDIO.bin + STUDIO.clips with uploaded:true) so Edl.normalize accepts them
      // and their frames draw. CONFIG.clips is NOT touched (the no-EDL timeline and CTA fallbacks keep using the baked clips). Idempotent; never
      // called = nothing changes. Returns a promise (first frames preloaded).
      window.addClips = async (list) => {
        const fresh = [];
        for (const c of list ?? []) {
          if (!c?.name || CLIP[c.name] || !(c.dur > 0) || !(c.n > 0)) continue;
          CLIP[c.name] = { name: c.name, start: 0, dur: c.dur, n: c.n, faces: c.faces ?? { source: "default", step: 3, samples: [] } };
          BIN.push({ name: c.name, dur: c.dur });
          WORDS_BY_CLIP[c.name] = (await fetchJson(`../footage/${c.name}/words.json`)) ?? [];
          window.STUDIO.bin.push({ name: c.name, dur: c.dur, n: c.n, uploaded: true });
          window.STUDIO.clips.push({ name: c.name, start: 0, dur: c.dur, n: c.n, uploaded: true });
          fresh.push(c.name);
        }
        await preloadFootage(fresh.map((name) => ({ dir: `../footage/${name}`, start: 0 })), 0);
        return fresh;
      };

      // EDL frame: layers bottom -> top (crossfade = outgoing at 1, incoming at its alpha), optional punch-in crop, then the colour plate.
      const punchRect = (p) => {
        const w = 1080 / p.scale, h = 1920 / p.scale;
        return { x: Math.max(0, Math.min(1080 - w, (p.cx ?? 0.5) * 1080 - w / 2)), y: Math.max(0, Math.min(1920 - h, (p.cy ?? 0.5) * 1920 - h / 2)), w, h };
      };
      // Registry transitions (r.fx): the two layers are drawn into cached scratch canvases, then engine/transitions renders the overlap.
      const fxScratch = new Map(); // "WxH" -> {from, to} canvases
      const fxCanvas = (key) => {
        if (!fxScratch.has(key)) {
          const mk = () => { const c = document.createElement("canvas"); c.width = B.W; c.height = B.H; return c; };
          fxScratch.set(key, { from: mk(), to: mk() });
        }
        return fxScratch.get(key);
      };
      const drawFx = async (ctx, r) => {
        const sc = fxCanvas(`${B.W}x${B.H}`);
        const drawInto = async (c, l) => {
          const fc = c.getContext("2d");
          fc.setTransform(1, 0, 0, 1, 0, 0);
          fc.globalAlpha = 1;
          fc.clearRect(0, 0, B.W, B.H);
          const opts = { start: 0, fps: 30, fit: "cover", n: CLIP[l.clip].n };
          if (l.punch) opts.crop = punchRect(l.punch);
          await drawFootage(fc, `../footage/${l.clip}`, l.srcT, opts);
        };
        await drawInto(sc.from, r.layers[0]);
        await drawInto(sc.to, r.layers[1]);
        const colors = brand.colors ?? {};
        Tr.renderTransition(r.fx.type, ctx, {
          from: sc.from, to: sc.to, u: r.fx.u, W: B.W, H: B.H,
          brand: { primary: colors.primary ?? "#000", ink: colors.ink ?? "#000", paper: colors.paper ?? "#fff" },
          params: r.fx.params, seed: r.fx.seed,
        });
        ctx.globalAlpha = 1;
      };
      const drawCut = async (ctx, t) => {
        const r = Edl.outToSrc(EDL, t);
        if (!r) return;
        if (r.fx) await drawFx(ctx, r);
        else for (const l of r.layers) {
          const opts = { start: 0, fps: 30, fit: "cover", n: CLIP[l.clip].n };
          if (l.punch) opts.crop = punchRect(l.punch);
          ctx.globalAlpha = l.alpha;
          await drawFootage(ctx, `../footage/${l.clip}`, l.srcT, opts);
        }
        ctx.globalAlpha = r.plate ? r.plate.a : 1;
        if (r.plate) { ctx.fillStyle = r.plate.color === "white" ? "#fff" : "#000"; ctx.fillRect(0, 0, B.W, B.H); }
        ctx.globalAlpha = 1;
      };
      const draw = async (t, ctx) => {
        await B.productsReady();
        await B.uiReady();
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, B.W, B.H);
        if (EDL) {
          if (!CONFIG.cta || t < CONFIG.cta.at) await drawCut(ctx, t);
        } else {
          const clip = CONFIG.clips.find((c) => t >= c.start && t < c.start + c.dur) ?? CONFIG.clips[CONFIG.clips.length - 1];
          if (!CONFIG.cta || t < CONFIG.cta.at) {
            await drawFootage(ctx, `../footage/${clip.name}`, t, { start: clip.start, fps: 30, fit: "cover", n: clip.n });
          }
        }
        const live = !CONFIG.cta || t < CONFIG.cta.at;
        // z-order: footage > panel > keyword/stack/counter/tag > hook > captions > logo bug > toast > top (logoSting) > CTA card > AI label
        if (live) {
          await B.drawMotion(MOTION, t, B.MOTION_LAYERS.under);
          await B.drawMotion(MOTION, t, B.MOTION_LAYERS.mid);
        }
        if (CONFIG.hook) B.hookTitle(CONFIG.hook.text, t, CONFIG.hook.inAt, CONFIG.hook.outAt);
        // Captions glide above any visible floating panel (panel box ends at y 1520).
        // Captions stay out of the way while a ui element (captions: "hide", the default) is on screen.
        if ((words.length || CAP_DOC?.segments?.length) && live && !B.captionsHidden(MOTION, t)) B.captions(words, t, { ...capStyle(), phrases: capPhrases(), highlight: HIGHLIGHT, hiddenWindows: B.captionHideWindows(MOTION), y: B.captionsY(MOTION, t, capStyle().y ?? 1180) });
        // logoUntil: hide the bug once footage with its own branding (e.g. a product mockup) starts.
        // The bug sits in the header corner farther from the face and fades while any element would cover it.
        const LG = logoOpts();
        B.logoBug(t, LG.in ?? 0.3, LG.out ?? CONFIG.logoUntil ?? (CONFIG.cta ? CONFIG.cta.at : Infinity), { ...LG, corner: PLAN.logo.corner, hide: LG.autoHide === false ? [] : PLAN.logo.hide });
        // Toasts sit below the header band (y >= 350), above the logo bug in z-order.
        if (live) await B.drawMotion(MOTION, t, B.MOTION_LAYERS.over);
        // "top" layer (motion-lib closers such as logoSting): above the toast and the logo bug, below the CTA card.
        if (live) await B.drawMotion(MOTION, t, B.MOTION_LAYERS.top);
        // brand.cta_card.background: "paper" (light brands) or "ink" (default, dark card).
        // cta.json bg: "light" -> paper card, "dark" -> ink card (overrides the brand setting).
        const ctaColors = (b, pref) => (({ light: "paper", dark: "ink" })[pref] ?? b.cta_card?.background) === "paper" ? { bg: b.colors.paper, fg: b.colors.ink } : {};
        if (CONFIG.cta) {
          const cd = ctaOpts();
          B.ctaCard(t, { title: cd.title ?? brand.cta?.primary, subtitle: cd.subtitle ?? "", contact: CONFIG.cta.contact }, { at: CONFIG.cta.at, ...ctaColors(brand, cd.bg), ...(cd.logoVariant ? { logoVariant: cd.logoVariant } : {}) });
        }
        // Disclosure for AI-generated people/voices; no-op unless brand.ai_label is true.
        B.aiLabel(t, 0, Infinity, undefined, CONFIG.aiLabel ?? null);
        // QA sheet only (render.mjs qa mode sets window.QA): face box and element rects, never in the delivered video.
        if (window.QA && live) drawQa(ctx, PLAN, t);
      };
      // Calls are serialized (never two render(t) in flight); offline renders await each call, so their output is unchanged.
      let chain = Promise.resolve();
      window.render = (t) => {
        const run = chain.then(async () => {
          if (window.__BUFFER !== true) return draw(t, ctx);
          B.setCanvas(offCtx);
          try {
            await draw(t, offCtx);
          } finally {
            B.setCanvas(ctx);
          }
          ctx.drawImage(off, 0, 0);
        });
        chain = run.catch(() => {});
        return run;
      };

      await preloadFootage(CONFIG.clips.map((c) => ({ dir: `../footage/${c.name}`, start: c.start })), 0);
      if (EDL) { const r0 = Edl.outToSrc(EDL, 0); await preloadFootage(r0.layers.map((l) => ({ dir: `../footage/${l.clip}`, start: 0 })), r0.layers[0].srcT); }
      B.checkCtaLogoVariant(CONFIG.cta ? ctaOpts().logoVariant : null); // a missing CTA logo variant is an asset error before any frame is drawn
      await render(0.1);
      window.READY = true;
    </script>
  </body>
</html>
